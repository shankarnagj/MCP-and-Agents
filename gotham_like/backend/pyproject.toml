[project]
name = "tessera-backend"
version = "0.1.0"
description = "Tessera — local-first investigative intelligence & decision-support platform (backend)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0.30,<3",
  "psycopg[binary]>=3.2",
  "geoalchemy2>=0.15",
  "alembic>=1.13",
  "redis>=5",
  "networkx>=3.3",
  "numpy>=1.26",
  "scipy>=1.13",
  "rapidfuzz>=3.9",
  "pyarrow>=16",
  "PyJWT>=2.8",
  "bcrypt>=4.1",
  "cryptography>=42",
  "reportlab>=4.2",
  "prometheus-client>=0.20",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "jellyfish>=1.0", "ruff>=0.5"]

[tool.ruff]
line-length = 160
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "UP"]
ignore = ["S101", "S311", "B008", "UP007"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B"]
