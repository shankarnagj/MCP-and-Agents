server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  client_max_body_size 12m;

  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; connect-src 'self' ws: wss:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; worker-src 'self' blob:; script-src 'self'" always;

  location /api/ { proxy_pass http://backend:8000; proxy_set_header Host $host; proxy_set_header X-Request-ID $request_id; }
  location = /health { proxy_pass http://backend:8000; }
  location /ws { proxy_pass http://backend:8000; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 3600s; }
  location / { try_files $uri /index.html; }
}
